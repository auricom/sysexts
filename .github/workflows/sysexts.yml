name: "Build and publish sysexts"

on:
  pull_request:
    paths:
      - ".github/workflows/sysexts.yml"
      - "sysext.just"
      - "zen-browser/**"
      - "recur/**"
      - "resilio-sync/**"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/sysexts.yml"
      - "sysext.just"
      - "zen-browser/**"
      - "recur/**"
      - "resilio-sync/**"
  # Upstreams get new releases without any commit here
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "${{ matrix.sysext }} (Fedora ${{ matrix.fedora }}, ${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        sysext: ["zen-browser", "recur", "resilio-sync"]
        fedora: ["45"]
        runner: 
          - "ubuntu-26.04"
          # - "ubuntu-26.04-arm"
    env:
      IMAGE: "quay.io/fedora-ostree-desktops/base-atomic:${{ matrix.fedora }}"
    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v3

      - uses: oras-project/setup-oras@v1

      - name: "Install build tools"
        run: sudo apt-get update && sudo apt-get install -y cpio erofs-utils jq rpm rpm2cpio

      # The whole build runs as root: files created with sudo can not be
      # relabeled by a rootless podman. podman is preinstalled on the runners.
      - name: "Download packages"
        working-directory: ${{ matrix.sysext }}
        run: sudo env "PATH=${PATH}" just prepare-build "${IMAGE}"

      - name: "Check if already published"
        id: check
        working-directory: ${{ matrix.sysext }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86-64" ;;
            aarch64) arch="arm64" ;;
          esac
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.sysext }}"
          tag="$(cat version)-$(cat version_id)-${arch}"
          {
            echo "ref=${ref}"
            echo "tag=${tag}"
            echo "floating=$(cat version_id)-${arch}"
          } >> "${GITHUB_OUTPUT}"

          # Pushes and manual runs always rebuild (the scripts may have changed).
          # The nightly run only builds when the COPR has a new version.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "${GH_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
            if oras manifest fetch "${ref}:${tag}" > /dev/null 2>&1; then
              echo "${ref}:${tag} is already published, skipping" | tee -a "${GITHUB_STEP_SUMMARY}"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: "Build sysext"
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ matrix.sysext }}
        run: sudo env "PATH=${PATH}" just resume-build "${IMAGE}"

      - name: "Publish to ghcr.io"
        if: steps.check.outputs.skip != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.sysext }}
        env:
          GH_TOKEN: ${{ github.token }}
          SYSEXT: ${{ matrix.sysext }}
          REF: ${{ steps.check.outputs.ref }}
          TAG: ${{ steps.check.outputs.tag }}
          FLOATING: ${{ steps.check.outputs.floating }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          raw="$(ls ${SYSEXT}-*.raw)"
          oras push "${REF}:${TAG}" \
            --artifact-type application/vnd.systemd.sysext \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "${raw}:application/vnd.erofs"
          # Moving tag for the latest build on this Fedora release and arch
          oras tag "${REF}:${TAG}" "${FLOATING}"

          {
            echo "Published \`${REF}:${TAG}\` (also \`:${FLOATING}\`):"
            echo '```sh'
            echo "oras pull ${REF}:${FLOATING}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          # systemd-sysupdate source: all images live in one release, listed by SHA256SUMS
          gh release view "${SYSEXT}" > /dev/null 2>&1 ||
            gh release create "${SYSEXT}" --title "${SYSEXT} systemd system extensions for Fedora" \
              --notes "Sysupdate source for ${SYSEXT}.conf: images and SHA256SUMS." ||
            gh release view "${SYSEXT}" > /dev/null
          gh release upload "${SYSEXT}" "${raw}" --clobber

  # Runs once after every build job: sysupdate reads SHA256SUMS to list the images
  index:
    name: "Release index (${{ matrix.sysext }})"
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sysext: ["zen-browser", "recur", "resilio-sync"]
    steps:
      - uses: actions/checkout@v6

      - name: "Prune old images and publish SHA256SUMS"
        env:
          GH_TOKEN: ${{ github.token }}
          SYSEXT: ${{ matrix.sysext }}
        run: |
          set -euo pipefail
          list() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${SYSEXT}" \
              --jq '.assets[] | select(.name | endswith(".raw")) | "\(.digest | sub("^sha256:"; ""))  \(.name)"'
          }

          # Keep the two newest images per Fedora release and architecture
          list | sort -k2 -V | awk '{
            match($2, /[0-9]+-(x86-64|arm64)\.raw$/); key = substr($2, RSTART)
            names[key] = names[key] " " $2
          } END { for (k in names) print names[k] }' |
            while read -r -a images; do
              for ((i = 0; i < ${#images[@]} - 2; i++)); do
                gh release delete-asset "${SYSEXT}" "${images[i]}" --yes
              done
            done

          list > SHA256SUMS
          gh release upload "${SYSEXT}" SHA256SUMS "${SYSEXT}/${SYSEXT}.conf" --clobber
